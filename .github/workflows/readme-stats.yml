name: GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch Stats and Langs Cards
        run: |
          curl -o github-readme-stats.svg "https://vercel.app{{ github.repository_owner }}&show_icons=true&theme=transparent"
          curl -o github-readme-top-langs.svg "https://vercel.app{{ github.repository_owner }}&layout=compact&theme=transparent"

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add github-readme-stats.svg github-readme-top-langs.svg
          git commit -m "Update GitHub Stats and Top Langs" || echo "Sem mudanças"
          git push
